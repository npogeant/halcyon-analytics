version: 2

models:
  - name: stg_crm__customers
    description: >
      One row per customer per monthly snapshot (not deduplicated to current-state -- AE-09's minimal
      dim_customer dedupes it to current state directly; AE-10's dbt snapshot will later build the real
      SCD2 version from this same model). `segment` coalesces the pre/post schema-change columns from raw.
    data_tests:
      # Asserts this model's own output shape hasn't silently drifted -- the
      # earliest layer that would notice if the coalesce in this model's SQL
      # ever stopped matching what raw.customers actually sends (AE-09).
      - dbt_expectations.expect_table_columns_to_match_set:
          arguments:
            column_list:
              - customer_id
              - email
              - country
              - plan_tier
              - acquisition_channel
              - segment
              - consent_flag
              - created_date
              - updated_date
              - loaded_at
    columns:
      - name: customer_id
        description: Natural key. Not unique in this model -- see model description.
        data_tests:
          - not_null
      - name: email
        description: Customer email as of the snapshot.
      - name: country
        description: Country code as of the snapshot.
      - name: plan_tier
        description: Customer-level segmentation tier -- distinct from `stg_subscriptions__subscriptions.plan`.
      - name: acquisition_channel
        description: Fixed at signup, never revisited.
        data_tests:
          - accepted_values:
              arguments:
                values: ["paid_search", "paid_social", "email", "affiliate", "display", "organic"]
      - name: segment
        description: Marketing segment, coalesced from raw's `marketing_segment`/`segment` schema-change columns.
      - name: consent_flag
        description: Null on rows loaded under the pre-schema-change format.
      - name: created_date
        description: Customer signup date.
      - name: updated_date
        description: Date of the most recent attribute change.
      - name: loaded_at
        description: When this row was loaded into raw.
