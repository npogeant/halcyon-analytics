version: 2

models:
  - name: dim_customer
    description: >
      Type 2 slowly changing dimension: one row per historical version of a customer, not one row
      per customer. Answers "what was this customer's plan tier at the time of the order," not
      just "what is it now." Built on int_customer_history's one-time SQL reconstruction of the
      source's pre-existing history (see that model's header comment); a real `dbt snapshot`
      (snapshots/customers_snapshot.sql) is configured separately to capture any future change.
      Includes an unknown-member row (customer_key = '-1') so a fact row with a missing or
      unresolvable customer still joins to something.
    config:
      materialized: table
      contract:
        enforced: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - customer_id
              - valid_from
    columns:
      - name: customer_key
        data_type: varchar
        description: Surrogate key, generate_surrogate_key([customer_id, valid_from]). '-1' for the unknown member.
        constraints:
          - type: primary_key
          - type: not_null
      - name: customer_id
        data_type: varchar
        description: Natural key. Not unique on its own -- one row per historical version. 'unknown' for the unknown member.
        constraints:
          - type: not_null
      - name: email
        data_type: varchar
        description: Customer email as of this version.
      - name: country
        data_type: varchar
        description: Country code as of this version.
      - name: plan_tier
        data_type: varchar
        description: Customer-level segmentation tier as of this version -- distinct from `plan` on subscriptions.
      - name: acquisition_channel
        data_type: varchar
        description: Fixed at signup, never revisited -- same across every version of a customer.
      - name: segment
        data_type: varchar
        description: Marketing segment as of this version.
      - name: consent_flag
        data_type: boolean
        description: >
          Same across every version of a customer (verified never to vary once known -- see
          assert_consent_flag_is_invariant). Null for customers whose entire history predates the
          2025-09-01 schema change.
      - name: created_date
        data_type: date
        description: Customer signup date. Same across every version of a customer.
      - name: valid_from
        data_type: date
        description: Date this version became true. 1900-01-01 for the unknown member.
        constraints:
          - type: not_null
      - name: valid_to
        data_type: date
        description: Date this version stopped being true (exclusive). Null for the current version, including the unknown member.
      - name: is_current
        data_type: boolean
        description: True for exactly one version per customer_id -- the one with valid_to null.
        constraints:
          - type: not_null
